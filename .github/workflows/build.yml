name: Build

# Every push to master builds the Windows installer.
# If the version in package.json has no release yet, a release v<version> is created with the installer;
# otherwise the installer is only kept as a workflow artifact.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no code signing certificate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx tsc -p . && npx electron-builder --win nsis --publish never

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmichWallpaper-Setup-${{ steps.version.outputs.version }}
          path: release/ImmichWallpaper-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create release for a new version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists - bump the version in package.json to publish a new one."
          else
            gh release create "v$VERSION" release/ImmichWallpaper-Setup-$VERSION.exe \
              --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          fi
